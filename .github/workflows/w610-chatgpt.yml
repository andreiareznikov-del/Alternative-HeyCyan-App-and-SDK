name: W610 ChatGPT integration
on:
  workflow_dispatch:
  push:
    branches: [w610-chatgpt-integration]
permissions:
  contents: read
concurrency:
  group: w610-chatgpt-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Verify production app and physical Diagnostics baseline are unchanged
        run: |
          git diff --exit-code 50618c72191ad75475041667ac6e2ead6ae833cf -- android/CyanBridge/app android/CyanBridge/w610jpeg
          python3 -m unittest discover -s tools -p 'test_w610_chatgpt_manifest.py' -v
      - name: Verified transport tests, integration tests, lint and APK
        working-directory: android/CyanBridge
        env:
          GITHUB_TOKEN: ""
          META_GITHUB_TOKEN: ""
        run: |
          chmod +x gradlew
          JAVA_HOME="$JAVA_HOME" ./gradlew --no-daemon --stacktrace --max-workers=2 \
            :w610chatgpt:testDebugUnitTest :w610chatgpt:lintDebug :w610chatgpt:assembleDebug
      - name: Audit final manifest and prepare offline signing
        run: |
          mkdir -p audit
          APK=android/CyanBridge/w610chatgpt/build/outputs/apk/debug/w610chatgpt-debug-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -p -f 4 "$APK" audit/W610-ChatGPT-Integration-unsigned.apk
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print "$APK" > audit/AndroidManifest.xml
          python3 tools/w610_chatgpt_manifest.py audit/AndroidManifest.xml > audit/manifest-audit.json
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" audit/apksigner.jar
          python3 - <<'PY'
          import json,xml.etree.ElementTree as ET
          from pathlib import Path
          suites=[ET.parse(p).getroot() for p in Path('android/CyanBridge/w610chatgpt/build/test-results/testDebugUnitTest').glob('TEST-*.xml')]
          totals={k:sum(int(s.get(k,0)) for s in suites) for k in ['tests','errors','failures','skipped']}
          assert totals['tests'] >= 36 and totals['errors']==totals['failures']==totals['skipped']==0,totals
          Path('audit/tests.json').write_text(json.dumps(totals,indent=2))
          print(totals)
          PY
          (cd audit && sha256sum W610-ChatGPT-Integration-unsigned.apk > SHA256SUMS-unsigned.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: W610-ChatGPT-Integration-unsigned
          path: audit/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: W610-ChatGPT-test-reports
          path: |
            android/CyanBridge/w610chatgpt/build/reports/
            android/CyanBridge/w610chatgpt/build/test-results/
          retention-days: 30
